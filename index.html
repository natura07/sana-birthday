<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sana! 💖</title>
    <link rel="stylesheet" href="style.css">
    <!-- उर्दू फॉन्ट के लिए लिंक -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>Happy Birthday</h1>
        <h2>Sana ✨</h2>
        
        <div class="photo-box">
            <img src="Sana.jpg" alt="Sana" class="sana-photo" id="mainPhoto">
        </div>

        <p class="message">Your special birthday surprise is waiting below! ✨</p>
        
        <!-- सरप्राइज बटन जो गाना भी बजाएगा -->
        <button onclick="showSurprise()">🎉 Open Surprise</button>
        
        <!-- सरप्राइज एरिया -->
        <div id="surprise" style="display: none;">
            
            <!-- फोटो गैलरी -->
            <div class="gallery-container">
                <img id="galleryPhoto" src="Sana.jpg" alt="Sana Birthday" class="gallery-photo" style="width:100%; border-radius:15px; box-shadow: 0 5px 15px rgba(0,0,0,0.15);">
            </div>

            <!-- मल्टीपल नोट्स (Urdu + English) -->
            <div class="notes-container" style="margin-top: 20px;">
                <div class="note-card active-note" id="noteText"></div>
                <div class="note-controls" style="margin-top: 15px; display: flex; justify-content: space-between;">
                    <button class="nav-btn" onclick="prevNote()" style="padding: 8px 18px; font-size: 14px;">◀ Prev</button>
                    <button class="nav-btn" onclick="nextNote()" style="padding: 8px 18px; font-size: 14px;">Next ▶</button>
                </div>
            </div>

        </div>
    </div>

    <!-- 100% वर्किंग डायरेक्ट MP3 सॉन्ग लिंक जो ब्राउज़र ब्लॉक नहीं करेगा -->
    <audio id="birthdayMusic" src="https://soundhelix.com" loop preload="auto"></audio>

</body>
<script src="script.js"></script>
</html>
