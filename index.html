<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sana! 💖</title>
    <link rel="stylesheet" href="style.css">
    <!-- उर्दू फॉन्ट के लिए लिंक -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- 🔒 लॉगिन स्क्रीन -->
    <div id="passwordScreen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(135deg, #ffeef2 0%, #ffd1dc 50%, #f3e5f5 100%); display: flex; justify-content: center; align-items: center; z-index: 9999; transition: all 0.5s ease;">
        <div class="login-box">
            <div style="font-size: 45px; margin-bottom: 15px;">🔒</div>
            <h3 style="color: #d81b60; margin-bottom: 10px; font-size: 22px;">Enter Password</h3>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">This surprise is only for Sana ✨</p>
            
            <input type="password" id="passInput" placeholder="Enter Secret Code..." style="width: 100%; padding: 12px 20px; font-size: 16px; border-radius: 25px; border: 2px solid #ffb6c1; margin-bottom: 20px; text-align: center; outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);">
            
            <button onclick="checkPassword()" style="padding: 12px 30px; font-size: 16px; width: 100%;">Unlock Surprise 💖</button>
            <p id="errorMsg" style="color: #ff4757; font-size: 13px; margin-top: 12px; display: none; font-weight: bold;">❌ Wrong password! Try again.</p>
        </div>
    </div>

    <!-- 💘 जादुई तीर-दिल एनीमेशन स्क्रीन (लॉगिन सफल होने पर यह दिखेगी) -->
    <div id="heartArrowScreen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 240, 245, 0.95); display: none; justify-content: center; align-items: center; z-index: 10000;">
        <div class="love-animation-container">
            <div class="animated-heart">❤️</div>
            <div class="animated-arrow">🏹</div>
        </div>
    </div>

    <!-- 📱 मुख्य कंटेंट कंटेनर -->
    <div class="container" id="mainContainer" style="filter: blur(5px); opacity: 0.3; transition: all 0.5s ease;">
        <h1>Happy Birthday</h1>
        <h2>Sana ✨</h2>
        
        <div class="photo-box">
            <img src="Sana.jpg" alt="Sana" class="sana-photo" id="mainPhoto">
        </div>

        <p class="message">Your special birthday surprise is waiting below! ✨</p>
        
        <button onclick="showSurprise()">🎉 Open Surprise</button>
        
        <div id="surprise" style="display: none;">
            <div class="gallery-container">
                <img id="galleryPhoto" src="Sana.jpg" alt="Sana Birthday" class="gallery-photo" style="width:100%; border-radius:15px; box-shadow: 0 5px 15px rgba(0,0,0,0.15);">
            </div>

            <div class="notes-container" style="margin-top: 20px;">
                <div class="note-card active-note" id="noteText"></div>
                <div class="note-controls" style="margin-top: 15px; display: flex; justify-content: space-between;">
                    <button class="nav-btn" onclick="prevNote()" style="padding: 8px 18px; font-size: 14px;">◀ Prev</button>
                    <button class="nav-btn" onclick="nextNote()" style="padding: 8px 18px; font-size: 14px;">Next ▶</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="birthdayMusic" src="https://soundhelix.com" loop preload="auto"></audio>

</body>
<script src="script.js"></script>
</html>
