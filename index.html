<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sana! 💖</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- 🔒 रील जैसा मॉडर्न लॉगिन स्क्रीन -->
    <div id="passwordScreen" class="auth-wrapper">
        <!-- बैकग्राउंड में घूमने वाली लिक्विड लाइट्स (जैसे रील में है) -->
        <div class="bg-blur-circle pink-circle"></div>
        <div class="bg-blur-circle purple-circle"></div>

        <div class="login-box">
            <div class="brand-heart">💖</div>
            
            <div class="urdu-title" style="font-family: 'Noto Nastaliq Urdu', serif; direction: rtl;">
                صرف تمہارے لیے، خدا کی دی ہوئی سب سے خوبصورت نعمت...
            </div>
            <p class="english-subtitle">A secret space made only for you.<br>Enter the code to unlock my heart. ✨</p>
            
            <!-- पासवर्ड इनपुट एरिया -->
            <div class="input-wrapper">
                <input type="password" id="passInput" placeholder="Enter Secret Code...">
                <span class="input-line"></span>
            </div>
            
            <button onclick="checkPassword()" class="btn-unlock">Unlock My World 🌹</button>
            <p id="errorMsg" class="error-text">❌ Wrong code, my love! Try again.</p>
        </div>
    </div>

    <!-- 📱 मुख्य कंटेंट कंटेनर (सफल लॉगिन के बाद दिखेगा) -->
    <div class="container" id="mainContainer" style="display: none;">
        <h1>Happy Birthday</h1>
        <h2>Sana ✨</h2>
        
        <div class="photo-box">
            <img src="Sana.jpg" alt="Sana" class="sana-photo" id="mainPhoto">
        </div>

        <p class="message">Your special birthday surprise is waiting below! ✨</p>
        
        <button onclick="showSurprise()" class="btn-surprise">🎉 Open Surprise</button>
        
        <div id="surprise" style="display: none;">
            <div class="gallery-container">
                <img id="galleryPhoto" src="Sana.jpg" alt="Sana Birthday" class="gallery-photo" style="width:100%; border-radius:15px; box-shadow: 0 5px 15px rgba(0,0,0,0.15);">
            </div>

            <div class="notes-container" style="margin-top: 20px;">
                <div class="note-card active-note" id="noteText"></div>
                <div class="note-controls" style="margin-top: 15px; display: flex; justify-content: space-between;">
                    <button class="nav-btn" onclick="prevNote()">◀ Prev</button>
                    <button class="nav-btn" onclick="nextNote()">Next ▶</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="birthdayMusic" src="https://soundhelix.com" loop preload="auto"></audio>

</body>
<script src="script.js"></script>
</html>
